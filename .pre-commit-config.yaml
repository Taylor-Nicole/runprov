# Same checks as CI, run locally. `python ci.py setup` once, then a failing push is
# something you find in a second rather than in a queue.

# BOTH HOOK TYPES, AND THE SECOND ONE IS A REPAIR. `pre-commit install` installs only the
# `pre-commit` type by default, so a `commit-msg` hook declared below would sit here doing
# nothing -- installed by no command, and looking exactly like a hook that was working. That is
# how the assistant-trailer rule came to have two definitions: the `commit-msg` guard had to be
# hand-written into `.git/hooks`, which is untracked, so a fresh clone got neither it nor any
# sign it had ever existed. Declared here so that `pre-commit install` does the right thing for
# anyone who runs it directly, and `ci.py setup` passes `--install-hooks` for the same reason.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # PINNED TO THE VERSION THE GATE ENFORCES, and it has to stay that way. This said v0.6.9
  # against a gate on 0.16.2 -- ten minor versions apart -- and with `--fix` that is worse
  # than a version skew: the hook REWRITES code to satisfy an old ruff, then CI rejects it
  # with the new one, so the tool that exists to catch a failure early creates one. There is
  # a test asserting these two agree.
# EVERY HOOK BELOW THAT REWRITES A FILE EXCLUDES THE BYTE-ASSERTED DIRECTORIES, and that is the
# same rule `.gitattributes` already states from the other direction. `tests/corpus/**` and
# `tests/fixtures/**` carry `-text` there because their BYTES are the subject: artifacts carry
# pins `verify` re-derives, and the environment snapshot's FILENAME is the digest of its body.
#
# `.gitattributes` stops GIT rewriting them on checkout. It does not stop a HOOK rewriting them on
# commit, and `end-of-file-fixer` did: 21 of the corpus's `*.prov.json` records are the only files
# there without a trailing newline, because that is how every released wheel wrote the sidecar, and
# the hook appended one to all 21. The whole suite stayed green -- 1 247 passed either way -- so
# nothing would have said so. Found 2026-10-09 by RUNNING the hooks, not by reading this file.
#
# The ruff hooks are excluded too, although no `.py` lives under either directory today. The reason
# is the rule rather than the file list: a digest-asserted `.py` fixture must not be reformatted
# either, and that is the day the exclusion has to already be here.
#
# `test_every_byte_asserted_directory_is_excluded_from_every_hook_that_rewrites_files` asks GIT
# which directories are protected and holds this file to the answer, so a third one is covered on
# the day it arrives rather than the day someone remembers.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # `ruff-check`, NOT `ruff`. Upstream renamed it and kept `ruff` as a documented
      # `# Legacy alias` whose `entry` and `types_or` are byte-identical, so this rename
      # changes no behaviour -- and `pre-commit` printed `ruff (legacy alias)` on every run,
      # which is a deprecation notice nothing was reading. An id that upstream later drops
      # fails for every contributor at once, and no test here can see it: a hook id is only
      # validated by RUNNING pre-commit, which no CI job does.
      - id: ruff-check
        args: [--fix]
        exclude: ^tests/(corpus|fixtures)/
      - id: ruff-format
        exclude: ^tests/(corpus|fixtures)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^tests/(corpus|fixtures)/
      - id: trailing-whitespace
        exclude: ^tests/(corpus|fixtures)/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      # This package has no data files. Anything large is a mistake, and a provenance
      # tool that ships someone's parquet by accident would be a poor advertisement.
        args: [--maxkb=200]
      - id: check-merge-conflict
  # THE RULE LIVES IN `ci.py`, AND THIS IS A CALLER. It used to be a hand-written `sh` regex in
  # an untracked `.git/hooks/commit-msg`, and the two copies drifted into guarding DIFFERENT
  # THINGS: the hook refused `Claude-Session:` and `ci.py` did not, so each half covered what the
  # other missed and the union existed only on one machine. Delegating means a family added to
  # `ci.py`'s `_REFUSED_TRAILERS` is enforced here the same day, with nothing to keep in step.
  #
  # AT COMMIT TIME, which is the only time that helps. `ci.py lint` reads the whole history and
  # is the authority, but by then the commit exists and may already be on a branch with a pull
  # request -- where GitHub freezes `refs/pull/*/head` and the trailer is permanent whatever
  # `main` says afterwards. Removing 230 of them once cost a 272-commit rewrite and a force-push
  # of a public repository, and three of those snapshots can still never be deleted.
  - repo: local
    hooks:
      - id: no-assistant-trailers
        name: refuse assistant attribution trailers
        entry: python ci.py check-commit-msg
        language: system
        stages: [commit-msg]
        # `pass_filenames` must stay TRUE: at this stage pre-commit passes the one message file,
        # and that path is the whole input. With it false the step would receive nothing and
        # refuse every commit -- a check that cannot pass, which is worse than one that cannot
        # fail because it gets switched off.
        pass_filenames: true
