[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runprov"
version = "0.1.0"
description = "Record what a script read, wrote and ran as — in a form a checker can verify"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Taylor Thompson", email = "taylor.nicole.thompson@gmail.com" }]
keywords = ["provenance", "reproducibility", "research-software", "data-lineage",
            "checksum", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Archiving",
    # Without this PyPI shows no licence at all: `license = {file = "LICENSE"}` fills
    # License-File and leaves the License field EMPTY, which reads as unlicensed on the
    # page most people will actually look at.
    "License :: CeCILL-B Free Software License Agreement (CECILL-B)",
]

# NO RUNTIME DEPENDENCIES, and that is a feature, not an omission. A provenance module is
# imported by every step of a pipeline; anything it depends on becomes a constraint on
# every one of them, and a version conflict in a provenance tool is a spectacularly silly
# reason to be unable to record a run. Verified: the package imports and runs on a system
# interpreter with nothing installed.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4", "pyyaml>=6"]  # pyyaml only to CHECK the rendered YAML
dev = ["runprov[test]", "ruff>=0.6", "mypy>=1.10", "build", "twine", "pre-commit"]

[project.urls]
Homepage = "https://github.com/Taylor-Nicole/runprov"
Issues = "https://github.com/Taylor-Nicole/runprov/issues"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
# NOT `strict`. Strict adds disallow_any_explicit and friends, and this package
# deliberately takes `Any` in two places -- `note(key, value)` records whatever number or
# string a script wants, and `configure(**kwargs)` forwards Project's own fields. Turning
# on a check you then have to suppress twice is theatre.

[tool.pytest.ini_options]
addopts = "-q --cov=runprov --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

# 80, not the 85.68 the suite currently achieves. A threshold set at today's exact number
# fails on the first line anyone adds, which trains people to lower it rather than to
# write the test -- and a gate that gets edited to pass is not a gate.
[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "raise SystemExit"]

[tool.hatch.build.targets.wheel]
packages = ["runprov"]
# py.typed must reach the wheel or PEP 561 does not apply and the annotations are
# invisible to every consumer's type checker.
artifacts = ["runprov/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["runprov", "tests", "ci.py", "README.md", "PUBLISHING.md", "WHY.md",
           "LICENSING.md", "CONTRIBUTING.md", "DCO.txt", "LICENSE", "CITATION.cff",
           ".ruff.toml", ".pre-commit-config.yaml"]
