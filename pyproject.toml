[build-system]
requires = ["hatchling>=1.27,<2"]  # 1.26.3 SILENTLY emits Metadata-Version 2.3 and
                                # a plain `License:` — it does not fail, it is just
                                # wrong. 1.25.0 rejects the PEP 639 license-files
                                # array outright. Both tested.
                                #
                                # UPPER BOUND, because this backend decides the
                                # Metadata-Version and that is a compatibility
                                # surface, not a detail. An unbounded requirement
                                # lets a future major pick one for us on tag day,
                                # in a build that cannot be re-uploaded.
                                #
                                # WE BUILD WITH 1.32.0 TODAY, and it emits
                                # Metadata-Version 2.5 -- inside this bound, and
                                # the comment here used to read as if 2.5 were the
                                # thing being excluded, which is the opposite of
                                # what the tree does. 2.5 is fine and was checked
                                # rather than assumed: PyPI serves hatchling's own
                                # 1.32.0 wheel with Metadata-Version 2.5, and
                                # `twine check --strict` passes both artifacts. The
                                # hazard the bound guards is a FUTURE 2.x, not this.
                                # (Old pkginfo <1.11 misreads 2.5 as `name = None`;
                                # that is a consumer-side bug, not a reason to emit
                                # older metadata.)
build-backend = "hatchling.build"

[project]
name = "runprov"
version = "0.1.0"
description = "Record what a script read, wrote and ran as — in a form a checker can verify"
readme = "README.md"
requires-python = ">=3.10"
license = "CECILL-B"          # PEP 639 SPDX expression
license-files = ["LICENSE"]   # redundant (the default glob finds it) but pins intent
authors = [{ name = "Taylor Thompson", email = "taylor.nicole.thompson@gmail.com" }]
keywords = ["provenance", "reproducibility", "research-software", "data-lineage",
            "checksum", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    # Per version, and ONLY the versions CI actually runs. A classifier is a claim about
    # where this works; `requires-python = ">=3.10"` is the constraint a resolver enforces,
    # and the two disagreeing is how a package ends up installed somewhere it was never
    # tested. Add the next one the October it goes green in the matrix, not before.
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Archiving",
    # NO "License :: ..." CLASSIFIER, and this is deliberate rather than an omission.
    #
    # The comment that used to sit here claimed `license = {file = "LICENSE"}` "leaves the
    # License field EMPTY". It does not: it inlines 21,392 bytes of the agreement into
    # METADATA, which PyPI renders in the sidebar and which can never be edited after
    # upload. It merely LOOKED empty because the LICENSE file's first line is blank, so the
    # header renders as `License: ` followed by 514 indented continuation lines. The
    # classifier was added to fix a misread of `head PKG-INFO`.
    #
    # PEP 639 forbids combining a License-Expression with a `License ::` classifier, but
    # NOTHING IN THIS TOOLCHAIN ENFORCES IT — verified on hatchling 1.27.0, 1.30.1 and
    # 1.31.0: all three build silently and emit both. `twine check --strict` passes the
    # invalid artifact, and so does packaging's own validator. setuptools does refuse it;
    # this backend does not. So if someone re-adds the classifier "for discoverability",
    # the only thing that will stop them is this comment.
]

# NO RUNTIME DEPENDENCIES, and that is a feature, not an omission. A provenance module is
# imported by every step of a pipeline; anything it depends on becomes a constraint on
# every one of them, and a version conflict in a provenance tool is a spectacularly silly
# reason to be unable to record a run. Verified: the package imports and runs on a system
# interpreter with nothing installed.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4", "pyyaml>=6"]  # pyyaml only to CHECK the rendered YAML
# ruff and mypy are pinned EXACTLY, and deliberately: both are moving
# specifications, and an unpinned formatter turns an unrelated push red. The CI
# lint job installs these same versions, so "it passes locally" means something.
dev = ["runprov[test]", "ruff==0.16.2", "mypy==2.3.0", "build", "twine", "pre-commit"]

[project.scripts]
# `runprov log ...` on PATH, not only `python -m runprov`. Absent until now, and its
# absence is quiet: the module form works, so nothing fails — it is the OTHER forms that
# cannot exist without an entry point. `uvx runprov` and `pipx run runprov` both resolve a
# console script and neither can reach a `-m` module, so the "a reviewer can install it and
# check your claims" argument in PUBLISHING.md was one command short of true.
runprov = "runprov.__main__:main"

[project.urls]
Homepage = "https://github.com/Taylor-Nicole/runprov"
Issues = "https://github.com/Taylor-Nicole/runprov/issues"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict = true
# STRICT, and the comment that used to sit here was wrong on its own terms. It refused
# strict because "strict adds disallow_any_explicit and friends" -- it does not; that is a
# separate flag, and the two deliberate `Any`s survive strict untouched. Measured: strict
# reported 15 errors, ALL [type-arg], ALL bare `dict`/`list`, none about `Any`. Fifteen
# one-token annotations and it passes with ZERO suppressions. The reason given for not
# running a check was invented rather than measured, which is the failure this repository
# is about, in the config of the tool meant to catch it.

[tool.pytest.ini_options]
addopts = "-q"
# NO COVERAGE FLAGS HERE, deliberately. `addopts` applies to every invocation of pytest in
# this directory, so a distribution packager running a bare `pytest` -- Debian, conda-forge,
# a Nix build -- hits an unknown `--cov` and the build fails on a plugin nobody asked
# for. The gate is not weakened: `ci.py test` passes the same flags, and CI calls ci.py.
testpaths = ["tests"]

# 100, and it is reachable here: the package is 2,151 statements and 772 branches with no I/O
# it cannot fake. 100 is the only threshold that does not need defending -- any other number
# is an argument about which lines deserve a test, held once and then never revisited. The
# earlier 80 was set because the suite achieved 85.68; that is the wrong direction of
# reasoning, and the tests were written to close the gap instead.
#
# `--cov-branch` IS THE GATE, and it was missing until 2026-08-11. Statement coverage read
# 100% while five conditions had never been evaluated both ways: the with-block that records
# nothing, both halves of `module()`'s file check, the empty rename component, and an
# unreadable distribution with no collector. That is this package's own meta-finding arriving
# a second time -- four regressions in the C0a state machine survived 91/91 green, because a
# line that RAN is not a behaviour that was CHECKED, and a partial branch is precisely a
# condition whose other half nobody has ever executed. Statement-only coverage cannot see it.
[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "raise SystemExit"]

[tool.hatch.build.targets.wheel]
packages = ["runprov"]
# py.typed must reach the wheel or PEP 561 does not apply and the annotations are
# invisible to every consumer's type checker.
artifacts = ["runprov/py.typed"]

[tool.hatch.build.targets.sdist]
# An EXPLICIT list, so anything not named here is excluded -- which is why CHANGELOG.md and
# SECURITY.md were missing from it while sitting in git, and the README linked to both. The
# audience for the sdist is exactly the person that hurts: a Debian, conda-forge or Nix
# packager rebuilding from the tarball, who gets the tests and `ci.py` to verify the build
# and then no security policy to read and no changelog to attribute a version to.
#
# `.gitattributes` and `.github/` stay out deliberately, and that is a different judgement
# rather than the same oversight: the first only affects a git checkout (it marks the
# hash-pinned fixtures `-text`, and the tarball already preserves their bytes exactly), and
# the second is CI configuration for THIS repository, which a downstream rebuild does not
# run and cannot use.
#
# PUBLISHING.md AND LICENSING.md ARE NOT HERE, and their absence is the deliberate half of
# this list. Both are internal working documents addressed to one person -- "that decision,
# and the account it happens under, are yours" -- and both carry superseded reasoning kept
# on purpose (PUBLISHING.md recommends MIT; the licence has been CeCILL-B since 2026-08-07,
# and the file says so a section later). Inside the sdist that reads as the project's
# position rather than as somebody's notes, and it travels beside a README that PyPI freezes
# forever. They stay in the repository, where the audience is the person they address.
include = ["runprov", "tests", "examples", "ci.py", "README.md", "WHY.md",
           "GETTING-STARTED.md", "docs",
           "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "DCO.txt", "LICENSE",
           "CITATION.cff", "CHANGELOG.md", "SECURITY.md", ".ruff.toml",
           ".pre-commit-config.yaml"]
# `examples` is here because a test runs it: shipping the suite without the file it
# executes would make the sdist's own tests fail for the packager who runs them.
