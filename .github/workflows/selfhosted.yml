# The Linux half of the matrix, on a runner that costs nothing.
#
# WHY THIS FILE EXISTS. Actions minutes are billed for PRIVATE repositories, and billing on
# this account has been failing since 2026-08-13 — so every hosted job since then has died in
# three seconds having run zero steps, and the last green matrix is over a hundred commits
# behind. A self-hosted runner is free for a private repo and gives today's tree an answer
# today. `test.yml` is left exactly as it is: it describes the matrix this project intends to
# run, and it will run it again the moment billing is fixed or the repository goes public.
#
# WHAT IT CANNOT SAY. Linux only. macOS and Windows are not covered and are not claimed —
# Windows in particular is the leg that proves the `msvcrt` fallback for `flock`, which is
# the whole reason it is in the hosted matrix. A green run here is evidence about Linux and
# about nothing else, and the summary below says so rather than leaving a green tick to
# imply more than it knows.
#
# NO `actions/setup-python`. On a hosted runner it fetches an interpreter; here it would
# reach for a tool cache this machine does not have. The interpreters are already installed,
# so the job uses them directly and FAILS LOUDLY if one is missing rather than silently
# testing three versions and reporting four.
name: self-hosted (linux)

on:
  workflow_dispatch:
  # NOT `push`. The runner is a process on one desk, not a service: when it is down a
  # push-triggered job queues indefinitely and shows as pending, which is a worse signal than
  # no signal. Dispatch is deliberate, and deliberate is what this is for.

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false # one version failing must not hide the others
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # FULL HISTORY. `actions/checkout` clones at depth 1 by default, and the suite
        # verifies that every commit the README's CI section cites is an ancestor of HEAD —
        # which a shallow clone cannot answer, so the check FAILED IN CI while passing on
        # every developer machine. Found by dispatching the self-hosted runner rather than by
        # reading: the repository is ~200 commits, so the cost of the full clone is noise.
        with:
          fetch-depth: 0

      - name: Find the interpreter, or fail saying which one is missing
        id: py
        uses: ./.github/actions/find-python
        with:
          version: ${{ matrix.python }}

      # A FRESH VENV PER LEG, under the runner's work directory rather than the checkout, so
      # nothing a test does to the tree can be mistaken for the environment and vice versa.
      - name: Install
        run: |
          set -euo pipefail
          "${{ steps.py.outputs.bin }}" -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet -e ".[test]"

      # `ci.py test`, not a bare pytest — the 100% floor lives in that script, and running
      # anything else here would be measuring a different thing from the gate.
      # See `test.yml` for why 3.13 alone cannot reach the floor: four `RuntimeError` guards
      # for `Path.resolve()` on a symlink loop, which 3.13 no longer raises. Unreachable by
      # construction, not by regression, and every other leg here still asserts 100%.
      - run: "$RUNNER_TEMP/venv/bin/python ci.py test"
        env:
          RUNPROV_COVERAGE_FLOOR: "${{ matrix.python == '3.13' && 'off' || '' }}"

  # THE OTHER TWO THIRDS OF THE GATE. This file ran `ci.py test` and nothing else, and its
  # summary did not say so — a green tick on the only CI that can start today read as "the
  # gate passed" when two of its three steps had not run (ledger A-29). Demonstrated at the
  # time: delete `"SECURITY.md"` from pyproject's sdist `include` and `ci.py test` still says
  # `OK — every step passed`, while `ci.py build` fails naming the missing file.
  #
  # ONE PYTHON EACH, not the matrix, which is what `test.yml` does and for the same reason:
  # neither step is version-dependent, and running four copies of an identical check buys
  # nothing but four times the runner's time on one desk.
  lint:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # FULL HISTORY. `actions/checkout` clones at depth 1 by default, and the suite
        # verifies that every commit the README's CI section cites is an ancestor of HEAD —
        # which a shallow clone cannot answer, so the check FAILED IN CI while passing on
        # every developer machine. Found by dispatching the self-hosted runner rather than by
        # reading: the repository is ~200 commits, so the cost of the full clone is noise.
        with:
          fetch-depth: 0
      - name: Find the interpreter, or fail saying which one is missing
        id: py
        uses: ./.github/actions/find-python
        with:
          version: "3.12"
      # PINNED, and the versions live in pyproject's `dev` extra — Dependabot reads that file
      # and does not read a `run:` line, and a test requires the two to agree (ledger A-27).
      - run: |
          set -euo pipefail
          "${{ steps.py.outputs.bin }}" -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/python" -m pip install --quiet "ruff==0.16.2" "mypy==2.3.0"
      - run: "$RUNNER_TEMP/lint/bin/python ci.py lint"

  build:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # FULL HISTORY. `actions/checkout` clones at depth 1 by default, and the suite
        # verifies that every commit the README's CI section cites is an ancestor of HEAD —
        # which a shallow clone cannot answer, so the check FAILED IN CI while passing on
        # every developer machine. Found by dispatching the self-hosted runner rather than by
        # reading: the repository is ~200 commits, so the cost of the full clone is noise.
        with:
          fetch-depth: 0
      - name: Find the interpreter, or fail saying which one is missing
        id: py
        uses: ./.github/actions/find-python
        with:
          version: "3.12"
      - run: |
          set -euo pipefail
          "${{ steps.py.outputs.bin }}" -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/python" -m pip install --quiet "build==1.5.0" "twine==7.0.0"
      # `ci.py build`, which does more than build: it checks the sdist against the include
      # list, installs the wheel into a clean venv, imports it from elsewhere, and runs the
      # suite the TARBALL ships from the tarball.
      - run: "$RUNNER_TEMP/build/bin/python ci.py build"

  summary:
    needs: [test, lint, build]
    if: always()
    runs-on: [self-hosted, linux]
    steps:
      - name: Say what this run does and does not prove
        run: |
          {
            echo "### Linux only — but the whole gate"
            echo
            echo "Python 3.10, 3.11, 3.12 and 3.13 on one self-hosted Linux runner."
            echo
            echo "**All three gates run here:** \`ci.py lint\` (ruff format, ruff check,"
            echo "mypy --strict), \`ci.py test\` (the suite and the 100% statement-and-branch"
            echo "floor, on all four interpreters) and \`ci.py build\` (sdist and wheel,"
            echo "twine check --strict, install into a clean venv, and the shipped suite run"
            echo "FROM the tarball). \`lint\` and \`build\` run on 3.12 only, as in"
            echo "\`test.yml\`: neither is version-dependent."
            echo
            echo "**Not covered:** macOS, and Windows — the leg that proves the \`msvcrt\`"
            echo "fallback for \`flock\`. Those need the hosted matrix in \`test.yml\`,"
            echo "which needs billing or a public repository."
          } >> "$GITHUB_STEP_SUMMARY"
