# Every commit in a pull request must carry `Signed-off-by:` (git commit -s).
# See CONTRIBUTING.md and DCO.txt for why.
name: dco

on: [pull_request]

jobs:
  signed-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the whole range, not just the tip
      - name: every commit carries Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            # Merge commits are generated by GitHub and cannot be signed by a contributor.
            if [ "$(git rev-list --parents -n1 "$sha" | wc -w)" -gt 2 ]; then continue; fi
            if ! git log -1 --format='%B' "$sha" |
                 grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::no Signed-off-by: $(git log -1 --format='%h %s' "$sha")"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "$missing commit(s) are unsigned. Fix the whole branch with:"
            echo "    git rebase --signoff origin/main && git push --force-with-lease"
            echo "or a single commit with:"
            echo "    git commit --amend -s --no-edit"
            exit 1
          fi
          echo "all commits signed off"
