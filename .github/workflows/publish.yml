# Publish to PyPI on a version tag, via Trusted Publishing (OIDC) — no API token is
# stored anywhere. Configure the publisher once at
# https://pypi.org/manage/account/publishing/ : owner, repo, workflow filename
# `publish.yml`, environment `pypi`.
name: publish

on:
  push:
    tags: ["v*"]

# LEAST PRIVILEGE, DECLARED AT THE TOP. Without this block every job inherits the
# repository default, which for older repositories is write-all -- so a compromised
# dependency of `build` or `test` could push to the repository during a release. Only
# `publish` needs anything more, and it says so itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # PINNED, and this is THE job to pin in: it produces the exact wheel and sdist
      # `publish` uploads, `on: push: tags` fires once, and PyPI never allows a version
      # to be re-uploaded. Every action above is SHA-pinned and the backend is
      # constrained (`hatchling>=1.27,<2`); the front-end tooling was the gap. Same
      # argument as `ruff` and `mypy` in test.yml, and the versions are kept in the
      # `dev` extra so Dependabot raises them — it does not read `run:` lines.
      # NO `--upgrade`: it defeats a pin the moment one exists.
      - run: python -m pip install "build==1.5.0" "twine==7.0.0"
      # `ci.py build`, NOT a bare `python -m build` plus `twine check`. The artifact this
      # job produces is the one that gets uploaded, and until this line it was the one
      # artifact nothing verified: test.yml runs the full build check but triggers on
      # `push: branches: [main]` and pull requests — NEVER on a tag. So the release path
      # skipped the py.typed check that PUBLISHING.md itself calls invisible (the source
      # tree type-checks, the wheel installs, and every consumer silently gets an untyped
      # package), on a version that can never be re-uploaded.
      #
      # It also runs `release-check` (see ci.py), and THIS is the job where that matters:
      # `GITHUB_REF_NAME` is the tag here, so tagging v0.2.0 on a tree that still says
      # 0.1.0 fails before anything is uploaded. Nothing checked that before -- PyPI would
      # have received 0.1.0 under a v0.2.0 tag, and 0.1.0 can never be re-uploaded to fix
      # it. It equally refuses a tag whose CHANGELOG section is still `[Unreleased]` or
      # whose CITATION.cff has no `date-released`, so a published version cannot be cited
      # without a year.
      #
      # It still runs twine check --strict — which catches a README PyPI refuses to
      # render — and adds: py.typed inside the wheel, the wheel installed into a clean
      # venv where it must RECORD a run and answer all three CLI commands, and the SDIST
      # built into a wheel of its own with no source tree in reach.
      - run: python ci.py build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python }}"
      - run: python -m pip install -e ".[test]"
      # NO `-q`: ci.py treats every argument as a step name, so `ci.py test -q`
      # exits 1 with "unknown step '-q'" and the publish job -- which needs this
      # one -- never runs. The entire release path was unexercised until this was
      # caught by reading it; a tag would have built and stopped. `-q` is already
      # in pyproject's addopts.
      - run: python ci.py test

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi
    # A job-level block REPLACES the top-level one rather than adding to it, so
    # `contents: read` is repeated here on purpose -- omit it and this job runs with
    # id-token and nothing else.
    permissions:
      id-token: write        # required for trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
