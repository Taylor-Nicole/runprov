# Publish via Trusted Publishing (OIDC) — no API token is stored anywhere. Configure the
# publisher once per index, at .../manage/account/publishing/ : owner, repo, workflow
# filename `publish.yml`, and the environment named below.
#
#   a tag `v*`          -> PyPI,     environment `pypi`
#   workflow_dispatch   -> TestPyPI, environment `testpypi`
#
# ONE FILE, TWO DESTINATIONS, AND NO INPUT TO CHOOSE BETWEEN THEM. The dispatch path can only
# ever reach TestPyPI and the tag path can only ever reach PyPI, because the destination is
# derived from the EVENT rather than from something a human types at dispatch time. A
# `target:` input would make publishing to the real index one wrong dropdown away, on a path
# whose entire purpose is to be run casually.
#
# AND IT IS WHY THIS PATH IS DISPATCHABLE AT ALL. Until 2026-09-11 this workflow ran only on a
# tag, which means it had NEVER RUN: its own comments record two defects found by reading it
# rather than by running it — a `-q` that would have exited 1, and a release path that skipped
# the build check entirely. A release path that cannot be rehearsed gets rehearsed on the
# release. TestPyPI is the rehearsal.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# LEAST PRIVILEGE, DECLARED AT THE TOP. Without this block every job inherits the
# repository default, which for older repositories is write-all -- so a compromised
# dependency of `build` or `test` could push to the repository during a release. Only
# `publish` needs anything more, and it says so itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # FULL HISTORY. `actions/checkout` clones at depth 1 by default, and the suite
        # verifies that every commit the README's CI section cites is an ancestor of HEAD —
        # which a shallow clone cannot answer, so the check FAILED IN CI while passing on
        # every developer machine. Found by dispatching the self-hosted runner rather than by
        # reading: the repository is ~200 commits, so the cost of the full clone is noise.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # PINNED, and this is THE job to pin in: it produces the exact wheel and sdist
      # `publish` uploads, `on: push: tags` fires once, and PyPI never allows a version
      # to be re-uploaded. Every action above is SHA-pinned and the backend is
      # constrained (`hatchling>=1.27,<2`); the front-end tooling was the gap. Same
      # argument as `ruff` and `mypy` in test.yml, and the versions are kept in the
      # `dev` extra so Dependabot raises them — it does not read `run:` lines.
      # NO `--upgrade`: it defeats a pin the moment one exists.
      # `comrak` IS NOT OPTIONAL HERE. It is readme_renderer's markdown backend, twine does
      # not pull it, and without it `twine check --strict` PASSES WITHOUT RENDERING the
      # description — the one field PyPI freezes at upload. `ci.py build` proves the renderer
      # works before running the check and refuses otherwise, which is what caught this: the
      # check had been vacuous in CI on every build, including the release path.
      - run: python -m pip install "build==1.5.0" "twine==7.0.0" comrak
      # `ci.py build`, NOT a bare `python -m build` plus `twine check`. The artifact this
      # job produces is the one that gets uploaded, and until this line it was the one
      # artifact nothing verified: test.yml runs the full build check but triggers on
      # `push: branches: [main]` and pull requests — NEVER on a tag. So the release path
      # skipped the py.typed check that PUBLISHING.md itself calls invisible (the source
      # tree type-checks, the wheel installs, and every consumer silently gets an untyped
      # package), on a version that can never be re-uploaded.
      #
      # It also runs `release-check` (see ci.py), and THIS is the job where that matters:
      # `GITHUB_REF_NAME` is the tag here, so tagging v0.2.0 on a tree that still says
      # 0.1.0 fails before anything is uploaded. Nothing checked that before -- PyPI would
      # have received 0.1.0 under a v0.2.0 tag, and 0.1.0 can never be re-uploaded to fix
      # it. It equally refuses a tag whose CHANGELOG section is still `[Unreleased]` or
      # whose CITATION.cff has no `date-released`, so a published version cannot be cited
      # without a year.
      #
      # It still runs twine check --strict — which catches a README PyPI refuses to
      # render — and adds: py.typed inside the wheel, the wheel installed into a clean
      # venv where it must RECORD a run and answer all three CLI commands, and the SDIST
      # built into a wheel of its own with no source tree in reach.
      - run: python ci.py build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # THE SAME EXEMPTION test.yml CARRIES, and its absence here is what this file's
          # first rehearsal found. On 3.13 `Path.resolve()` no longer raises for a symlink
          # loop, an over-long component or an unreadable directory, so four
          # `except (OSError, RuntimeError)` guards in `run.py` cannot be entered and the
          # 100% floor is unreachable BY CONSTRUCTION (ledger L-104). test.yml turns the
          # floor off for this leg; this file did not, so a real tag would have built
          # everything, failed at 99.72%, and never published.
          #
          # The floor is declared per leg and never sniffed at runtime — see `ci.py`, which
          # refuses to lower itself by inspecting the platform, because a floor that moves
          # on its own is a floor nobody can rely on. Declaring it twice is the cost, and
          # `test_every_leg_that_cannot_reach_the_floor_says_so` is what keeps the two
          # declarations from drifting again.
          - python: "3.13"
            coverage_floor: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # FULL HISTORY. `actions/checkout` clones at depth 1 by default, and the suite
        # verifies that every commit the README's CI section cites is an ancestor of HEAD —
        # which a shallow clone cannot answer, so the check FAILED IN CI while passing on
        # every developer machine. Found by dispatching the self-hosted runner rather than by
        # reading: the repository is ~200 commits, so the cost of the full clone is noise.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python }}"
      - run: python -m pip install -e ".[test]"
      # NO `-q`: ci.py treats every argument as a step name, so `ci.py test -q`
      # exits 1 with "unknown step '-q'" and the publish job -- which needs this
      # one -- never runs. The entire release path was unexercised until this was
      # caught by reading it; a tag would have built and stopped. `-q` is already
      # in pyproject's addopts.
      - run: python ci.py test
        env:
          RUNPROV_COVERAGE_FLOOR: "${{ matrix.coverage_floor }}"

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    # Derived from the event, not chosen. See the header.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    # A job-level block REPLACES the top-level one rather than adding to it, so
    # `contents: read` is repeated here on purpose -- omit it and this job runs with
    # id-token and nothing else.
    permissions:
      id-token: write        # required for trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # BOTH URLs ARE SPELLED OUT, including the default one. Leaving the tag path to the
      # action's default would mean the two destinations are expressed in different ways, and
      # the one that matters would be the one not written down.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: >-
            ${{ github.event_name == 'workflow_dispatch'
                && 'https://test.pypi.org/legacy/'
                || 'https://upload.pypi.org/legacy/' }}
