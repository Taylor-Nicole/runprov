# Publish to PyPI on a version tag, via Trusted Publishing (OIDC) — no API token is
# stored anywhere. Configure the publisher once at
# https://pypi.org/manage/account/publishing/ : owner, repo, workflow filename
# `publish.yml`, environment `pypi`.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      # twine check catches a README PyPI will refuse to render — the most common reason a
      # first upload looks fine and lands ugly, and unfixable afterwards because a version
      # can never be re-uploaded.
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python }}"
      - run: python -m pip install -e ".[test]"
      # NO `-q`: ci.py treats every argument as a step name, so `ci.py test -q`
      # exits 1 with "unknown step '-q'" and the publish job -- which needs this
      # one -- never runs. The entire release path was unexercised until this was
      # caught by reading it; a tag would have built and stopped. `-q` is already
      # in pyproject's addopts.
      - run: python ci.py test

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
