# Runs on every push and pull request — NOT only at release time.
#
# The tests used to live inside publish.yml, which fires on a tag. Tests you discover are
# broken while cutting a release are tests that failed at the worst possible moment; this
# repository's whole subject is checks that only look green because they never ran.
name: test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here needs write access to anything.
permissions:
  contents: read

# A new push supersedes the run in flight. Cancelling it saves minutes and stops two
# results for the same branch arriving out of order.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # PINNED, not `--upgrade`. This job installed whatever ruff and mypy had released
      # that morning, so the lint gate changed WITHOUT A COMMIT: it went red on ruff 0.16.2
      # for a README code block that 0.15.15 had accepted, on a push that touched neither.
      # A formatter is a moving specification; pinning it is the difference between "this
      # code is badly formatted" and "the formatter changed its mind overnight".
      # Same argument as the SHA-pinned actions above. Dependabot raises both.
      - run: python -m pip install "ruff==0.16.2" "mypy==2.3.0"
      # Calls ci.py, which is what a contributor runs locally. If this job restated the
      # commands instead, the two would drift and "it passes locally" would stop meaning
      # anything.
      - run: python ci.py lint

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # one platform failing must not hide the others
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # macOS and Windows on one version each. Windows earns its place: the run-history
          # append takes an advisory flock, and fcntl does not exist there — this is the
          # job that proves the documented fallback actually works rather than merely
          # being written down.
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
            # 22 tests build a fixture Windows cannot build — a FIFO, a symlink, a file
            # `chmod(0o000)` genuinely makes unreadable — and they skip there (see the
            # probes at the top of the suite). Skipped tests leave their lines unmeasured,
            # so the 100% floor is unreachable HERE by construction, not by regression.
            # Every other leg still asserts it; this is the only place the word `off`
            # appears, on purpose.
            coverage_floor: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python }}"
      - run: python -m pip install -e ".[test]"
      # `ci.py test`, NOT a bare `pytest`. The coverage gate lives in that script rather than
      # in pyproject's `addopts` so a downstream packager without pytest-cov can still run
      # the suite -- which meant the gate every document calls "the gate" ran only at tag
      # time, in publish.yml. Coverage could have fallen on every push for the life of the
      # project and the release would have been the first thing to notice.
      - run: python ci.py test
        env:
          RUNPROV_COVERAGE_FLOOR: "${{ matrix.coverage_floor }}"

  build:
    # On every push, not only on a tag. A README that PyPI refuses to render is unfixable
    # after upload, because a version can never be re-uploaded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      # Same script again — build, twine check --strict, then install the wheel into a
      # clean venv and import it from elsewhere.
      - run: python ci.py build
