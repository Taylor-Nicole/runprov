# Runs on every push and pull request — NOT only at release time.
#
# The tests used to live inside publish.yml, which fires on a tag. Tests you discover are
# broken while cutting a release are tests that failed at the worst possible moment; this
# repository's whole subject is checks that only look green because they never ran.
name: test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here needs write access to anything.
permissions:
  contents: read

# A new push supersedes the run in flight. Cancelling it saves minutes and stops two
# results for the same branch arriving out of order.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # FULL HISTORY. `actions/checkout` clones at depth 1 by default, and the suite
        # verifies that every commit the README's CI section cites is an ancestor of HEAD —
        # which a shallow clone cannot answer, so the check FAILED IN CI while passing on
        # every developer machine. Found by dispatching the self-hosted runner rather than by
        # reading: the repository is ~200 commits, so the cost of the full clone is noise.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # PINNED, not `--upgrade`. This job installed whatever ruff and mypy had released
      # that morning, so the lint gate changed WITHOUT A COMMIT: it went red on ruff 0.16.2
      # for a README code block that 0.15.15 had accepted, on a push that touched neither.
      # A formatter is a moving specification; pinning it is the difference between "this
      # code is badly formatted" and "the formatter changed its mind overnight".
      # Same argument as the SHA-pinned actions above. Dependabot raises both.
      #
      # AND `.[test]` SINCE 2026-10-11 (F1), BECAUSE THE CHECK'S ENVIRONMENT MUST MATCH THE
      # CHECK'S SCOPE. `ci.py lint` type-checked `runprov/` alone and needed nothing installed;
      # it now derives its scope from `git ls-files`, which puts `tests/conftest.py` in it, and
      # that imports `pytest`. Without the extra, mypy reports `Cannot find implementation or
      # library stub for module named "pytest"` and THIS JOB GOES RED WHILE A DEVELOPER MACHINE
      # STAYS GREEN -- the failure mode this repository has counted twenty-two times. Found by
      # rebuilding this job's exact environment locally, not by reading.
      - run: python -m pip install -e ".[test]" "ruff==0.16.10" "mypy==2.3.1"
      # Calls ci.py, which is what a contributor runs locally. If this job restated the
      # commands instead, the two would drift and "it passes locally" would stop meaning
      # anything.
      - run: python ci.py lint
      # THE CORPUS FIXTURE'S OWN HONESTY, once rather than on every matrix leg: whether the
      # PACKAGE still agrees with those records is asked by `ci.py test`, which runs
      # everywhere. This asks whether the committed trees carry a path from the machine that
      # built them, and proves its own scanner with a planted one.
      - run: python ci.py corpus

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # one platform failing must not hide the others
      matrix:
        # PINNED, AND THE PIN IS THE IMAGE THIS MATRIX WAS MEASURED GREEN ON.
        # `ubuntu-latest` is a moving label. GitHub announced its migration to Ubuntu 26
        # over 2026-10-19 -> 2026-11-19 (actions/runner-images#14748), and inside that
        # window the label's resolution is NOT readable from GitHub's own documentation,
        # which still prints the pre-migration mapping. So it was read off this
        # repository's own run instead: `dd27b7b`, job `test (ubuntu-latest, 3.12)`,
        # `Image: ubuntu-24.04`, version `20261025.353.1`. This pin therefore changes
        # nothing about today's behaviour -- it freezes what already ran.
        #
        # WHAT IT BUYS IS ATTRIBUTION. Every other input to CI here is pinned so that a
        # red belongs to a commit: actions by SHA, `ruff` and `mypy` by version, the
        # interpreter by `python-version`. A floating label was the one remaining input
        # that could change with no commit, no diff and no author -- and `macos-latest`
        # has already moved under this repository once, to macOS 26.
        #
        # IT PINS THE OS, NOT THE IMAGE, and that limit is stated rather than implied.
        # Images are rebuilt weekly and no label can request an older build, so a new
        # 24.04 build still arrives unannounced. This BOUNDS the environment; only a
        # container image would reproduce it.
        #
        # IT DEGRADES LOUDLY, which is what makes it safe to set and leave. A retired
        # label is "terminated with an error" after weeks of scheduled brownouts, never
        # remapped to a newer image. The one way that could be absorbed quietly -- a
        # self-hosted runner carrying the label -- does not apply here: this
        # repository's runner is registered `[self-hosted, Linux, X64, local]` and
        # matches no version label, so a dead pin fails at dispatch.
        #
        # REVISIT: 24.04 has no announced end date (`ubuntu-22.04`'s is 2027-04-17, for
        # scale). The move to 26.04 should be a commit with a green run behind it rather
        # than an ambient event.
        os: [ubuntu-24.04]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # 3.13 CANNOT REACH 100%, and it is not a regression. CPython 3.13 changed
          # `Path.resolve()`: a symlink loop returns the path unchanged instead of raising
          # `RuntimeError` (ledger L-104). Four `except (OSError, RuntimeError)` guards in
          # `run.py` exist for 3.10-3.12, where the loop DOES raise, and on 3.13 nothing can
          # enter them — measured on 3.13.15, `resolve()` raises for none of a symlink loop,
          # a 5,000-character component, or a directory with no execute permission. So the
          # guards must stay for the supported range and are unreachable on the newest
          # version, which is the Windows argument in a different disguise.
          #
          # FOUND BY THE SELF-HOSTED RUNNER, on the first green-except-3.13 result in over a
          # hundred commits. This leg has been unpassable for as long as 3.13 has been in the
          # matrix and hosted billing has been down, and nothing said so.
          # THIS `os` MUST MATCH THE AXIS ABOVE, not merely name Ubuntu. An `include`
          # entry whose list-valued keys match an existing combination MODIFIES it; one
          # that matches nothing ADDS a leg. Measured: pinning the axis and leaving this
          # line on `ubuntu-latest` expands the matrix to SEVEN legs -- a real
          # `ubuntu-24.04 / 3.13` leg with the floor ON, which cannot reach 100%, beside
          # an orphan `ubuntu-latest / 3.13, off` that modifies nothing. Both floor
          # guards stayed GREEN on that tree, which is why it is now held explicitly by
          # `test_a_floor_override_MODIFIES_a_leg_the_matrix_actually_runs`.
          - os: ubuntu-24.04
            python: "3.13"
            coverage_floor: "off"
          # macOS and Windows on one version each. Windows earns its place: the run-history
          # append takes an advisory flock, and fcntl does not exist there — this is the
          # job that proves the documented fallback actually works rather than merely
          # being written down.
          #
          # PINNED FOR THE SAME REASON AS THE AXIS, off the same green run (`dd27b7b`):
          # `Image: macos-26-arm64` version `20261026.0455.2`, and
          # `Image: windows-2025-vs2026` version `20261021.278.1`. These two were the last
          # CI inputs here that could change with no commit, no diff and no author.
          #
          # THE IMAGE NAME IS NOT THE LABEL, which is the trap this pin had to avoid and
          # the axis above did not. `ubuntu-24.04` happens to be spelled identically as an
          # image and as a label; neither of these is. `macos-26-arm64` is not a label at
          # all — the arm64 macOS 26 label is `macos-26` — so pinning to the measured
          # image name would have failed at dispatch. `windows-2025-vs2026` IS a label,
          # which is the worse case: GitHub's migration changelog says it "is meant for
          # testing only" and that after the June 2026 migration it points at the
          # `windows-2025` image, so pinning to it would have frozen a transitional alias
          # instead of the OS. Both labels were confirmed against two independently-keyed
          # sources: the `runner-images` README table and GitHub's hosted-runners
          # reference.
          #
          # macOS CARRIES AN ARCHITECTURE IN THE LABEL, not only a version: `macos-26` is
          # arm64, and the x64 macOS 26 images are the separate labels `macos-26-intel`
          # and `macos-26-large`. So `macos-latest` moving under this repository could
          # move the ISA, which is a larger unattributed change than a version bump.
          # `macos-26` preserves the architecture that was measured green.
          #
          # ONE BIT WAS NOT MEASURED BEFORE THIS COMMIT, named rather than glossed: the
          # run above resolved `windows-latest`, not `windows-2025`. GitHub's changelog
          # states both labels migrated to the VS2026 image by 2026-06-15, but `win25` and
          # `win25-vs2026` are STILL both rebuilt weekly — four releases each in the last
          # month — so the two labels carrying different images is not impossible. It is
          # harmless either way here: no step invokes a C toolchain. This pin's own run
          # reports the image it was given, which is where that bit gets settled.
          #
          # REVISIT: neither macOS 26 nor Windows Server 2025 has an announced end date.
          # For scale, GitHub keeps two GA images per family and retires the older — and
          # macOS 14 is retired on 2026-11-02 after EIGHT scheduled brownout windows
          # across October, which is this month's demonstration that a dying label is
          # failed rather than quietly remapped.
          - os: macos-26
            python: "3.12"
          - os: windows-2025
            python: "3.12"
            # THIS IS THE ONE PLACE THE COUNT IS STATED [Audit N]. `ci.py`'s own floor
            # comment used to carry a second, different figure for the same set of tests —
            # "22 tests" there against "49 tests" here — so it now states the mechanism and
            # names this file, and the number lives here beside the `off` it justifies.
            #
            # Tests that build something Windows cannot build — a FIFO, a symlink, a file
            # `chmod(0o000)` genuinely makes unreadable, an executable `#!/bin/sh` script, a
            # directory opened as a file, an `os.kill` that delivers a signal instead of
            # terminating the process — skip there; see the probes at the top of the suite.
            # MEASURED on run 33575026376, 2026-09-02: 49 such tests, 722 passed, 50 skipped,
            # against 769 and 5 on ubuntu. That is a DATED measurement and reads as one: it
            # is not re-derived on every run and will drift as the suite grows, which is why
            # it carries its date and its run id rather than being restated as a live claim.
            # Skipped tests leave their lines unmeasured, so the 100% floor is unreachable
            # HERE by construction, not by regression. Every other leg still asserts it; this
            # is the only place the word `off` appears, on purpose — and that floor is also
            # what catches a filesystem probe that silently regresses, which is recorded at
            # the probes themselves and in `ci.py:_coverage_args`.
            coverage_floor: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # FULL HISTORY. `actions/checkout` clones at depth 1 by default, and the suite
        # verifies that every commit the README's CI section cites is an ancestor of HEAD —
        # which a shallow clone cannot answer, so the check FAILED IN CI while passing on
        # every developer machine. Found by dispatching the self-hosted runner rather than by
        # reading: the repository is ~200 commits, so the cost of the full clone is noise.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python }}"
      - run: python -m pip install -e ".[test]"
      # `ci.py test`, NOT a bare `pytest`. The coverage gate lives in that script rather than
      # in pyproject's `addopts` so a downstream packager without pytest-cov can still run
      # the suite -- which meant the gate every document calls "the gate" ran only at tag
      # time, in publish.yml. Coverage could have fallen on every push for the life of the
      # project and the release would have been the first thing to notice.
      - run: python ci.py test
        env:
          RUNPROV_COVERAGE_FLOOR: "${{ matrix.coverage_floor }}"

  build:
    # On every push, not only on a tag. A README that PyPI refuses to render is unfixable
    # after upload, because a version can never be re-uploaded.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # FULL HISTORY. `actions/checkout` clones at depth 1 by default, and the suite
        # verifies that every commit the README's CI section cites is an ancestor of HEAD —
        # which a shallow clone cannot answer, so the check FAILED IN CI while passing on
        # every developer machine. Found by dispatching the self-hosted runner rather than by
        # reading: the repository is ~200 commits, so the cost of the full clone is noise.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Pinned for the same reason as the release job, which builds the artifact that
      # is actually uploaded. Here the blast radius is only a red check — but two
      # copies of one toolchain that disagree is how the red check stops meaning
      # anything about the release.
      # `comrak` IS NOT OPTIONAL HERE. It is readme_renderer's markdown backend, twine does
      # not pull it, and without it `twine check --strict` PASSES WITHOUT RENDERING the
      # description — the one field PyPI freezes at upload. `ci.py build` proves the renderer
      # works before running the check and refuses otherwise, which is what caught this: the
      # check had been vacuous in CI on every build, including the release path.
      - run: python -m pip install "build==1.6.1" "twine==7.0.0" comrak
      # Same script again — build, twine check --strict, then install the wheel into a
      # clean venv and import it from elsewhere.
      - run: python ci.py build
